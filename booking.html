<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booking Home Visit • drh. Kartika Amarilis</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f8fafc;
      }

      .booking-header {
        background: linear-gradient(135deg, #4caf50, #2e7d32);
        color: white;
        padding: 60px 0;
        text-align: center;
        border-radius: 0 0 24px 24px;
        margin-bottom: 40px;
      }

      .booking-card {
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      .info-box {
        border-left: 4px solid #4caf50;
        padding-left: 15px;
        margin-bottom: 25px;
      }

      .form-control,
      .form-select {
        padding: 12px;
        border-radius: 10px;
      }

      .btn-book {
        padding: 14px;
        font-size: 18px;
        border-radius: 12px;
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <header class="booking-header">
      <div class="container">
        <h1 class="fw-bold">Form Booking Home Visit</h1>
        <p class="lead">
          Isi data di bawah ini untuk permintaan pemeriksaan hewan di rumah.
        </p>
      </div>
    </header>

    <!-- CONTENT -->
    <div class="container mb-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="booking-card">
            <!-- INFO AREA -->
            <div class="info-box">
              <p class="mb-1 fw-semibold">Area Layanan:</p>
              <p class="mb-2">
                Tangerang • Tangerang Selatan • Cipondoh • Karawaci • BSD
              </p>

              <p class="mb-1 fw-semibold">Jam Operasional:</p>
              <p class="mb-0">
                Senin – Jumat (di luar jadwal klinik) • Sabtu & Minggu tersedia
                full
              </p>
            </div>

            <!-- FORM -->
            <form id="bookingForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Nama Pemilik</label>
                <input type="text" class="form-control" id="nama" required />
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Nomor WhatsApp</label>
                <input
                  type="tel"
                  class="form-control"
                  id="wa"
                  required
                  placeholder="08xxxxxxxxxx"
                />
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Alamat Lengkap</label>
                <textarea
                  class="form-control"
                  id="alamat"
                  rows="3"
                  required
                ></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Jenis Hewan</label>
                <select class="form-select" id="jenisHewan" required>
                  <option value="">Pilih jenis hewan</option>
                  <option>Kucing</option>
                  <option>Anjing</option>
                  <option>Kelinci</option>
                  <option>Hewan kecil lainnya</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold"
                  >Layanan yang Dibutuhkan</label
                >
                <select class="form-select" id="layanan" required>
                  <option value="">Pilih layanan</option>
                  <option>Vaksin</option>
                  <option>Check-up ringan</option>
                  <option>Pengobatan dasar</option>
                  <option>Pemeriksaan luka</option>
                  <option>Lainnya</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Catatan Tambahan</label>
                <textarea
                  class="form-control"
                  id="catatan"
                  rows="2"
                  placeholder="Contoh: usia hewan, gejala, atau permintaan waktu"
                ></textarea>
              </div>

              <!-- BUTTON -->
              <button
                type="submit"
                class="btn btn-success btn-book w-100 fw-bold"
              >
                Kirim ke WhatsApp
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPT: Convert Form → WhatsApp -->
    <script>
      document
        .getElementById("bookingForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const nama = document.getElementById("nama").value;
          const wa = document.getElementById("wa").value;
          const alamat = document.getElementById("alamat").value;
          const jenisHewan = document.getElementById("jenisHewan").value;
          const layanan = document.getElementById("layanan").value;
          const catatan = document.getElementById("catatan").value;

          const pesan = `
🔔 *Permintaan Booking Home Visit*
Nama: ${nama}
WhatsApp: ${wa}
Alamat: ${alamat}

Hewan: ${jenisHewan}
Layanan: ${layanan}

Catatan:
${catatan}
`.trim();

          // Ganti nomor WA tujuan dokter
          const nomorTujuan = "6282299182673";

          const url = `https://wa.me/${nomorTujuan}?text=${encodeURIComponent(
            pesan
          )}`;

          window.open(url, "_blank");
        });
    </script>
  </body>
</html>
